:root{--navy:#020042;--navy3:#1A1A8C;--gold:#F3D831;--gold2:#C9961A;--red:#E5202E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
#stage{position:absolute;left:50%;top:50%;height:1080px;transform-origin:center;font-family:BC;color:#fff}
.abs{position:absolute}
.frame{inset:0;border:22px solid var(--navy);border-radius:34px;box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 40px rgba(0,0,0,.45)}
.panel{background:linear-gradient(180deg,var(--navy3),var(--navy) 70%);border:3px solid var(--gold);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
/* subs + live */
.subs{left:58px;top:56px;display:flex;align-items:center}
.subs .coin{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,#0B0B66,var(--navy));border:4px solid var(--gold);display:grid;place-items:center;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.subs .coin img{width:104px}
.subs .box{margin-left:-30px;padding:10px 30px 8px 52px;border-radius:0 14px 14px 0}
.subs .n{font-weight:800;font-size:60px;line-height:1}
.subs .l{margin-top:4px;background:var(--gold);color:var(--navy);font-family:B;font-weight:700;font-size:17px;letter-spacing:5px;text-align:center;border-radius:4px;padding:3px 10px 1px}
.live{left:58px;top:212px;display:flex;align-items:center;gap:10px;background:var(--red);font-weight:800;font-size:30px;letter-spacing:3px;padding:4px 16px 2px;border-radius:8px}
.live i{width:12px;height:12px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
/* scorebug */
.bug{left:50%;top:34px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:opacity .4s,transform .4s}
.bug.off{opacity:0;transform:translateX(-50%) translateY(-30px)}
.bug .lg{background:var(--navy);border:3px solid var(--gold);border-bottom:0;border-radius:12px 12px 0 0;padding:4px 28px 2px;font-weight:800;font-size:22px;letter-spacing:3px;color:var(--gold)}
.bug .row{display:flex;height:84px;border:3px solid var(--gold);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.bug .tm{min-width:170px;padding:0 18px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:56px}
.bug .sc{width:84px;background:linear-gradient(180deg,var(--navy3),var(--navy));display:grid;place-items:center;font-weight:800;font-size:66px}
.bug .sc.flash{animation:fl 1s ease 3}@keyframes fl{50%{background:var(--gold);color:var(--navy)}}
.bug .ck{width:160px;background:#fff;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:2px solid #ddd;border-right:2px solid #ddd}
.bug .ck b{font-family:B;font-weight:700;font-size:17px;letter-spacing:3px}.bug .ck span{font-weight:800;font-size:40px;line-height:1}
.bug .ck em{font-style:normal;font-size:22px;color:var(--red);margin-left:4px}
.goal{left:50%;top:150px;transform:translateX(-50%) scale(.5);padding:8px 60px 4px;border-radius:16px;background:linear-gradient(180deg,#FFF1A8,var(--gold) 50%,var(--gold2));color:var(--navy);font-weight:800;font-size:110px;line-height:1;opacity:0;white-space:nowrap;box-shadow:0 0 0 5px var(--navy),0 20px 50px rgba(0,0,0,.6)}
.goal small{display:block;font-size:34px;letter-spacing:6px;text-align:center}
.goal.show{animation:goal 4.5s ease forwards}
@keyframes goal{0%{opacity:0;transform:translateX(-50%) scale(.5)}10%{opacity:1;transform:translateX(-50%) scale(1.08)}16%,85%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
/* right card */
.card{right:60px;top:70px;width:430px;height:650px;overflow:hidden}
.card .hd{position:absolute;left:0;right:0;top:0;height:70px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:38px;letter-spacing:2px;z-index:3}
.card .hd .chip{width:22px;height:22px;border-radius:50%;border:3px solid var(--navy)}
.slide{position:absolute;left:0;right:0;top:70px;bottom:0;opacity:0;transform:translateX(40px);transition:opacity .6s,transform .6s}
.slide.on{opacity:1;transform:none}
/* pitch */
.pitch{position:absolute;inset:0;background:repeating-linear-gradient(180deg,#2F8F3E 0 58px,#287E35 58px 116px)}
.pitch svg{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px)}
.pl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:110px}
.pl b{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.45);display:grid;place-items:center;font-weight:800;font-size:20px}
.pl span{margin-top:4px;font-family:B;font-weight:700;font-size:var(--fs,17px);line-height:1.05;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,.9),0 0 2px #000;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.form{position:absolute;right:12px;top:10px;background:rgba(2,0,66,.85);border:2px solid var(--gold);border-radius:8px;padding:2px 10px;font-weight:800;font-size:22px;color:var(--gold);z-index:2}
/* table */
.tbl{padding:12px 16px}
.tr{display:grid;grid-template-columns:40px 1fr 46px 56px 60px;align-items:center;height:51px;border-bottom:1px solid rgba(255,255,255,.12);font-weight:800;font-size:26px}
.tr.h{height:34px;font-family:B;font-weight:700;font-size:14px;letter-spacing:3px;color:var(--gold)}
.tr div:nth-child(n+3){text-align:center}.tr div:last-child{color:var(--gold)}
.tr.me{background:rgba(243,216,49,.18);border-radius:8px}
.empty{padding:40px 30px;text-align:center;font-family:B;font-weight:700;font-size:22px;color:#C8C8F0;line-height:1.5}
/* sponsor + logo cards */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.sp-img{max-width:100%;max-height:100%;object-fit:contain}
.sp-name{font-weight:800;font-size:84px;line-height:.9;background:linear-gradient(180deg,#fff 30%,#FFE97A);-webkit-background-clip:text;color:transparent}
.sp-tag{font-family:B;font-weight:700;font-size:24px;color:#E6E6FF;line-height:1.35}
.sp-pill{background:var(--gold);color:var(--navy);font-weight:800;font-size:28px;letter-spacing:2px;padding:8px 22px 4px;border-radius:8px}
.gg img{width:250px;filter:drop-shadow(0 0 30px rgba(243,216,49,.45))}
.gg .t{font-family:B;font-weight:700;font-size:22px;color:#D6D6F5;line-height:1.4}
/* sponsor strip */
.strip{right:60px;top:734px;width:430px;height:82px;display:flex;align-items:center;overflow:hidden}
.strip .k{height:100%;background:var(--gold);color:var(--navy);display:flex;flex-direction:column;justify-content:center;padding:0 16px;font-family:B;font-weight:700;font-size:14px;letter-spacing:3px;line-height:1.3}
.strip .v{flex:1;height:100%;display:flex;align-items:center;justify-content:center;padding:8px 14px}
.strip .v img{max-height:100%;max-width:100%;object-fit:contain}
.strip .v span{font-weight:800;font-size:44px;letter-spacing:2px}
/* bottom row */
.date{left:58px;top:830px;width:190px;height:196px;border-radius:14px;overflow:hidden;text-align:center;border:3px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.55)}
.date .dy{background:var(--gold);color:var(--navy);font-family:B;font-weight:700;font-size:18px;letter-spacing:3px;padding:8px 0 5px}
.date .mid{background:#fff;color:var(--navy);padding:4px 0 6px}
.date .dd{font-weight:800;font-size:74px;line-height:.95}
.date .mm{font-family:B;font-weight:700;font-size:18px;letter-spacing:5px;color:#666}
.date .tt{background:var(--navy);font-weight:800;font-size:34px;padding:6px 0}
.head{left:266px;right:786px;top:830px;height:112px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 20px}
.head span{font-weight:800;font-size:72px;letter-spacing:2px;background:linear-gradient(180deg,#fff 40%,#FFF1A8);-webkit-background-clip:text;color:transparent}
.soc{right:508px;top:830px;width:262px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.soc .h{font-weight:800;font-size:28px;letter-spacing:2px;color:var(--gold)}
.soc .ic{display:flex;gap:12px}.soc .ic svg{width:38px;height:38px;border-radius:9px;display:block;box-shadow:0 2px 6px rgba(0,0,0,.4)}

<script>
/* ===================================================================
   SETTINGS  —  open this file in Notepad / TextEdit, change, save, Refresh in OBS
   =================================================================== */
const CONFIG = {
  timezone: 'Asia/Yangon',  // clock time zone (Myanmar)
  cardSeconds: 15,          // seconds per right-side card when rotating
  sponsorName: 'MG MAHAR',
  sponsorTagline: 'Official partner of Golden Goal live watch-alongs',
  sponsorCTA: 'LINK IN DESCRIPTION',
  homeColor: '#FFFFFF', homeText: '#111111',   // shirt colours used on the line-up pitch
  awayColor: '#EF0107', awayText: '#FFFFFF',
  ticker: ['Welcome to Golden Goal live watch-along!','Drop your score prediction in the chat','Subscribe and turn on notifications 🔔','Join our Telegram for match news and line-ups'],
  cta: ['CHECK OUT THE LINKS IN THE DESCRIPTION!','SUBSCRIBE & TURN ON NOTIFICATIONS!','JOIN OUR TELEGRAM CHANNEL!']
};
/* Put these image files in the SAME folder as this overlay (optional):
     sponsor.png       → MG Mahar logo for the strip
     sponsor-ad.png    → MG Mahar full advert for the right card (portrait, about 430 x 580)   */
/* =================================================================== */

const $=id=>document.getElementById(id);
const st=$('stage');function fit(){const s=innerHeight/1080;st.style.width=(innerWidth/s)+'px';st.style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();

const DEF={home:'NEW',away:'ARS',homeFull:'NEWCASTLE',awayFull:'ARSENAL',h:0,a:0,per:'1ST',add:'',base:0,running:false,t0:0,
  league:'PREMIER LEAGUE',headline:'GOLDEN GOAL LIVE',subs:'12,500',handle:'@GOLDENGOAL',bug:true,
  pin:'',
  xiH:{f:'4-3-3',p:['','','','','','','','','','',''],n:['1','2','5','6','3','8','4','10','7','9','11']},
  xiA:{f:'4-3-3',p:['','','','','','','','','','',''],n:['1','2','5','6','3','8','4','10','7','9','11']},
  table:[], ticker:null, cta:null,
  dateMode:'auto', tz:'', dateTxt:{day:'SUNDAY',date:'22',mon:'NOV',time:'12:00AM'},
  icons:{yt:1,tt:1,fb:1,tg:1}, socImg:''};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('gg_live')||'{}'))}catch(e){S=Object.assign({},DEF)}
if(new URLSearchParams(location.search).has('reset'))S=Object.assign({},DEF);
['xiH','xiA'].forEach(k=>{if(!S[k].n)S[k].n=S[k].p.map((_,i)=>String(i+1));if(S[k].p.every(x=>x.length<=2))S[k].p=S[k].p.map(()=>'')});
S.icons=Object.assign({yt:1,tt:1,fb:1,tg:1},S.icons||{});S.dateTxt=Object.assign({},DEF.dateTxt,S.dateTxt||{});
const save=()=>{try{localStorage.setItem('gg_live',JSON.stringify(S))}catch(e){}};
const hist=[];const snap=()=>{hist.push(JSON.stringify(S));if(hist.length>30)hist.shift()};

/* ---------- clock ---------- */
const secs=()=>Math.max(0,Math.floor(S.base+(S.running?(Date.now()-S.t0)/1000:0)));
const mmss=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
setInterval(()=>{$('clock').textContent=mmss(secs())},250);
function dateClock(){if(S.dateMode==='manual'){const t=S.dateTxt;$('dDay').textContent=t.day;$('dDate').textContent=t.date;$('dMon').textContent=t.mon;$('dTime').textContent=t.time;return}
  const d=new Date(),f=o=>new Intl.DateTimeFormat('en-US',Object.assign({timeZone:S.tz||CONFIG.timezone},o)).format(d);
  $('dDay').textContent=f({weekday:'long'}).toUpperCase();$('dDate').textContent=f({day:'numeric'});
  $('dMon').textContent=f({month:'short'}).toUpperCase();$('dTime').textContent=f({hour:'numeric',minute:'2-digit',hour12:true}).replace(' ','')}
dateClock();setInterval(dateClock,1000);

/* ---------- right-side cards ---------- */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pitchHTML(xi,col,txt){
  const rows=[1].concat(xi.f.split('-').map(Number));let i=0,out='';
  rows.forEach((n,r)=>{const y=92-r*(80/(rows.length-1));for(let k=0;k<n;k++){const x=(k+1)*100/(n+1);
    const nm=(xi.p[i]||'').trim(),no=((xi.n||[])[i]||'').trim();i++;
    const w=Math.min(118,Math.floor(396/n)-6),fs=n>=5?14:n===4?16:17;
    out+=`<div class="pl" style="left:${x}%;top:${y}%;width:${w}px;--fs:${fs}px"><b style="background:${col};color:${txt}">${no||(r===0?'GK':i)}</b><span>${esc(nm)}</span></div>`}});
  return `<div class="pitch"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><g fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".6">
   <rect x="0" y="0" width="100" height="100"/><line x1="0" y1="0" x2="100" y2="0"/><circle cx="50" cy="0" r="14"/>
   <rect x="22" y="82" width="56" height="18"/><rect x="36" y="93" width="28" height="7"/></g></svg>
   <div class="form">${xi.f}</div>${out}</div>`}
function tableHTML(){
  if(!S.table.length)return `<div class="empty">No table yet.<br><br>Send <b>/table</b> to the bot, one team per line:<br><span style="color:#F3D831">1 ARS 9 15 25</span><br>(position, team, played, goal diff, points)</div>`;
  return `<div class="tbl"><div class="tr h"><div>#</div><div>TEAM</div><div>P</div><div>GD</div><div>PTS</div></div>`+
    S.table.slice(0,10).map(r=>`<div class="tr ${[S.home,S.away].includes(r[1].toUpperCase())?'me':''}"><div>${r[0]}</div><div>${r[1]}</div><div>${r[2]||''}</div><div>${r[3]||''}</div><div>${r[4]||''}</div></div>`).join('')+'</div>'}
let spAd=null,spLogo=null;
function sponsorHTML(){
  if(spAd)return `<div class="center" style="padding:0;height:100%"><img class="sp-img" src="sponsor-ad.png"></div>`;

function showCard(id){const c=CARDS.find(x=>x.id===id)||CARDS[0];const box=$('slides');
  box.innerHTML=`<div class="slide">${c.html()}</div>`;requestAnimationFrame(()=>requestAnimationFrame(()=>box.firstChild.classList.add('on')));
  $('cardHd').innerHTML=(c.dot?`<span class="chip" style="background:${c.dot()}"></span>`:'')+c.title()}
function rotate(){if(S.pin){showCard(S.pin);return}showCard(CARDS[ci].id);ci=(ci+1)%CARDS.length}
setInterval(rotate,CONFIG.cardSeconds*1000);

/* ticker + cta */
function buildTicker(){const list=S.ticker||CONFIG.ticker;const t=$('trk'),h=list.map(x=>'<span>'+x+'</span>').join('');t.innerHTML=h+h;
  requestAnimationFrame(()=>{t.style.animationDuration=(t.scrollWidth/2/90)+'s'})}
const cta=$('cta');let cti=0;
function buildCta(){cta.innerHTML='';(S.cta&&S.cta.length?S.cta:CONFIG.cta).forEach(t=>{const d=document.createElement('div');d.textContent=t;cta.appendChild(d)});cti=0;cta.children[0].classList.add('on')}
setInterval(()=>{if(!cta.children.length)return;cti=(cti+1)%cta.children.length;[...cta.children].forEach(c=>c.classList.remove('on'));cta.children[cti].classList.add('on')},7000);

/* =================== COMMANDS (from the phone controller) =================== */
const KB={keyboard:[
  ['⚽ HOME GOAL','⚽ AWAY GOAL'],
  ['▶️ START','⏸ PAUSE','↩️ UNDO'],
  ['1ST','HT','2ND','FT'],
  ['🟩 HOME XI','🟥 AWAY XI','🏆 TABLE'],
  ['💰 SPONSOR','⭐ LOGO','🔄 AUTO'],
  ['👁 SCOREBOARD','❓ HELP']],resize_keyboard:true,is_persistent:true};
const HELP=`GOLDEN GOAL OVERLAY – commands
Buttons below control the match.
/teams NEW ARS Newcastle Arsenal
/score 1-0      /time 45:00      /add 3
/league PREMIER LEAGUE
/headline NEWCASTLE v ARSENAL
/subs 12,600     /handle @GOLDENGOAL
/xi home 4-3-3 Pope, Trippier, ... (11 names)
/xi away 4-2-3-1 Raya, White, ...
/table  (then one line per team: 1 ARS 12 18 28)
/ticker message one | message two | ...
/reset  (new match: score 0-0, clock 00:00)`;
function handle(text){
  const t=text.trim(),u=t.toUpperCase();let m;snap();let reply='';
  if(u==='/START'||u==='/HELP'||u.includes('HELP')){reply=HELP}
  else if(u.includes('HOME GOAL')){S.h++;goal('h');reply=`GOAL ${S.home}! ${S.h}-${S.a}`}
  else if(u.includes('AWAY GOAL')){S.a++;goal('a');reply=`GOAL ${S.away}! ${S.h}-${S.a}`}
  else if(u.includes('▶')||u==='START'){if(!S.running){S.running=true;S.t0=Date.now()}reply='Clock running'}
  else if(u.includes('⏸')||u==='PAUSE'){if(S.running){S.base=secs();S.running=false}reply='Clock paused at '+mmss(S.base)}
  else if(u.includes('UNDO')){hist.pop();const p=hist.pop();if(p){S=JSON.parse(p)}if(S.pin)showCard(S.pin);buildTicker();reply='Undone – score '+S.h+'-'+S.a}
  else if(u==='1ST'){S.per='1ST';S.base=0;S.running=false;S.add='';reply='1st half – clock at 00:00, press START at kick-off'}
  else if(u==='HT'){S.base=secs();S.running=false;S.per='HT';S.add='';reply='Half-time'}
  else if(u==='2ND'){S.per='2ND';S.base=2700;S.running=false;S.add='';reply='2nd half – clock at 45:00, press START at kick-off'}
  else if(u==='FT'){S.base=secs();S.running=false;S.per='FT';S.add='';reply='Full-time '+S.h+'-'+S.a}
  else if(u.includes('HOME XI')){S.pin='xiH';showCard('xiH');reply='Showing home XI (press AUTO to rotate again)'}
  else if(u.includes('AWAY XI')){S.pin='xiA';showCard('xiA');reply='Showing away XI'}
  else if(u.includes('TABLE')&&!u.startsWith('/TABLE')){S.pin='table';showCard('table');reply='Showing table'}
  else if(u.includes('SPONSOR')){S.pin='sponsor';showCard('sponsor');reply='Showing sponsor'}
  else if(u.includes('LOGO')){S.pin='logo';showCard('logo');reply='Showing logo'}
  else if(u.includes('AUTO')){S.pin='';rotate();reply='Cards rotating'}
  else if(u.includes('SCOREBOARD')){S.bug=!S.bug;reply='Scoreboard '+(S.bug?'shown':'hidden')}
  else if(m=t.match(/^\/teams\s+(\S+)\s+(\S+)(?:\s+(\S+)\s+(\S+))?/i)){S.home=m[1].toUpperCase();S.away=m[2].toUpperCase();S.homeFull=(m[3]||m[1]).replace(/_/g,' ').toUpperCase();S.awayFull=(m[4]||m[2]).replace(/_/g,' ').toUpperCase();reply='Teams: '+S.home+' v '+S.away}
  else if(m=t.match(/^\/score\s+(\d+)\s*[-:]\s*(\d+)/i)){S.h=+m[1];S.a=+m[2];reply='Score '+S.h+'-'+S.a}
  else if(m=t.match(/^\/time\s+(\d+)(?::(\d+))?/i)){S.base=(+m[1])*60+(+(m[2]||0));if(S.running)S.t0=Date.now();reply='Clock set to '+mmss(S.base)}
  else if(m=t.match(/^\/add\s*(\d*)/i)){S.add=m[1]||'';reply=S.add?'Added time +'+S.add:'Added time removed'}
  else if(m=t.match(/^\/league\s+(.+)/i)){S.league=m[1].toUpperCase();reply='League set'}
  else if(m=t.match(/^\/headline\s+(.+)/i)){S.headline=m[1].toUpperCase();reply='Headline set'}
  else if(m=t.match(/^\/subs\s+(.+)/i)){S.subs=m[1];reply='Subscribers set'}
  else if(m=t.match(/^\/handle\s+(.+)/i)){S.handle=m[1].toUpperCase();reply='Handle set'}
  else if(m=t.match(/^\/ticker\s+([\s\S]+)/i)){S.ticker=m[1].split('|').map(x=>x.trim()).filter(Boolean);buildTicker();reply='Ticker updated'}
  else if(m=t.match(/^\/xi\s+(home|away)\s+([\d-]+)\s+([\s\S]+)/i)){const p=m[3].split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
    const xi={f:m[2],p};if(m[1].toLowerCase()==='home'){S.xiH=xi;S.pin='xiH';showCard('xiH')}else{S.xiA=xi;S.pin='xiA';showCard('xiA')}
    const need=[1].concat(m[2].split('-').map(Number)).reduce((a,b)=>a+b,0);reply=`Line-up saved (${p.length}/${need} players)`}
  else if(m=t.match(/^\/table\s*([\s\S]*)/i)){S.table=m[1].split('\n').map(l=>l.trim().split(/\s+/)).filter(r=>r.length>=2);S.pin='table';showCard('table');reply='Table saved ('+S.table.length+' rows)'}
  else if(m=t.match(/^\/xi2\s+([\s\S]+)/i)){try{const d=JSON.parse(m[1]);const key=d.side==='away'?'xiA':'xiH';
      S[key]={f:d.f,p:d.p.map(x=>String(x||'').trim()),n:d.n.map(x=>String(x||'').trim())};S.pin=key;showCard(key);
      reply=`${d.side==='away'?S.away:S.home} line-up saved (${d.f})`}catch(e){reply='Line-up error'}}
  else if(m=t.match(/^\/set\s+([\s\S]+)/i)){try{const d=JSON.parse(m[1]);const ok=['cta','dateMode','tz','dateTxt','icons','socImg','handle','headline','subs','league'];
      Object.keys(d).forEach(k=>{if(ok.includes(k))S[k]=d[k]});if('cta' in d)buildCta();reply='Saved ✔'}catch(e){reply='Save error'}}
  else if(u==='/RESET'){Object.assign(S,{h:0,a:0,per:'1ST',add:'',base:0,running:false});reply='New match: 0-0, 00:00'}
  else {hist.pop();reply='Unknown command. Press ❓ HELP';}
  save();render();return reply}
window.handleCommand=handle;   // for testing

/* =================== LINK TO THE CONTROLLER (server.py) =================== */
function status(t,ok){const s=$('status');s.style.display=t?'block':'none';s.textContent=t;s.style.color=ok?'#7CFC9A':'#FF8A8A'}
let lastReply='';
function report(){if(!/^https?:$/.test(location.protocol))return;
  const out={home:S.home,away:S.away,h:S.h,a:S.a,per:S.per,add:S.add,secs:secs(),running:S.running,pin:S.pin,bug:S.bug,
    headline:S.headline,subs:S.subs,league:S.league,xiH:S.xiH,xiA:S.xiA,table:S.table,reply:lastReply,at:Date.now(),
    cta:(S.cta&&S.cta.length?S.cta:CONFIG.cta),ticker:(S.ticker||CONFIG.ticker),dateMode:S.dateMode,dateTxt:S.dateTxt,tz:S.tz||CONFIG.timezone,icons:S.icons,handle:S.handle,hasSocImg:!!S.socImg};
  fetch('/state',{method:'POST',body:JSON.stringify(out)}).catch(()=>{})}
function connect(){
  if(!/^https?:$/.test(location.protocol)){status('Open this overlay through server.py (see READ ME)',false);return}
  const es=new EventSource('/events');
  es.onopen=()=>status('',true);
  es.onmessage=e=>{try{const d=JSON.parse(e.data);lastReply=handle(d.cmd);report()}catch(err){}};
  es.onerror=()=>status('Controller offline – is server.py running?',false);
  setInterval(report,1000);report()}
render();buildTicker();rotate();connect();
</script></body></html>
